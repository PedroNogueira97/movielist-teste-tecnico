[project]
name = "movie-list-teste-tecnico"
version = "0.1.0"
description = "API REST (FastAPI) para leitura da lista de indicados e vencedores da categoria Pior Filme do Golden Raspberry Awards"
readme = "README.md"
authors = [
    { name = "Pedro Nogueira", email = "pedronogueiramoraes@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false
